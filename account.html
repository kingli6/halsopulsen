<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Account — HälsoPulsen</title>
  <link rel="icon" type="image/svg+xml" href="/images/favicon.svg" />
  <link rel="stylesheet" href="/style.css?v=9" />
  <style>
    .account-shell { max-width: 560px; margin: 0 auto; padding: 72px 20px; }
    .account-card { background: var(--color-surface); border: 1px solid var(--color-border); border-radius: var(--radius-md); padding: 32px; }
    .account-card h1 { margin-bottom: 10px; }
    .account-copy { color: var(--color-text-muted); margin-bottom: 24px; }
    #accountSignedIn { display: none; }
    #accountSignedIn.visible { display: block; }
    .account-actions { display: flex; gap: 12px; flex-wrap: wrap; margin-top: 24px; }
    #accountError { color: #b42318; min-height: 22px; font-size: 14px; }
    #clerkMount { min-height: 420px; }
  </style>
</head>
<body>
  <header class="nav-wrapper">
    <nav class="nav container">
      <a href="/" class="nav-logo">HälsoPulsen</a>
      <div class="nav-actions"><a href="/workout.html">Träningsverktyg</a></div>
    </nav>
  </header>
  <main class="account-shell">
    <section class="account-card">
      <h1>Your account</h1>
      <p class="account-copy">Sign in to keep your timer presets and workout plans available across sessions.</p>
      <p id="accountError" role="alert"></p>
      <div id="clerkMount"></div>
      <div id="accountSignedIn">
        <p>You are signed in.</p>
        <div class="account-actions">
          <a class="btn btn-primary" href="/plans/">Open my plans</a>
          <button class="btn btn-secondary" id="signOutBtn" type="button">Sign out</button>
        </div>
      </div>
    </section>
  </main>
  <script>
    (async () => {
      const error = document.getElementById("accountError");
      try {
        const config = await fetch("/api/auth/config").then(response => response.json());
        if (!config.publishableKey) throw new Error("Account sign-in is not configured.");

        const clerkDomain = atob(config.publishableKey.split("_")[2]).slice(0, -1);
        const loadScript = (src, attributes = {}) => new Promise((resolve, reject) => {
          const script = document.createElement("script");
          script.src = src;
          Object.entries(attributes).forEach(([name, value]) => script.setAttribute(name, value));
          script.addEventListener("load", resolve, { once: true });
          script.addEventListener("error", () => reject(new Error("Could not load account sign-in.")), { once: true });
          document.head.appendChild(script);
        });

        await loadScript(`https://${clerkDomain}/npm/@clerk/ui@1/dist/ui.browser.js`, {
          crossorigin: "anonymous"
        });
        const clerkScript = document.createElement("script");
        clerkScript.src = "https://cdn.jsdelivr.net/npm/@clerk/clerk-js@latest/dist/clerk.browser.js";
        clerkScript.setAttribute("data-clerk-publishable-key", config.publishableKey);
        await new Promise((resolve, reject) => {
          clerkScript.addEventListener("load", resolve, { once: true });
          clerkScript.addEventListener("error", () => reject(new Error("Could not load account sign-in.")), { once: true });
          document.head.appendChild(clerkScript);
        });

        if (!window.Clerk) throw new Error("Account sign-in is not configured.");
        const clerk = window.Clerk;
        await clerk.load({ ui: { ClerkUI: window.__internal_ClerkUICtor } });
        const mount = document.getElementById("clerkMount");
        const signedIn = document.getElementById("accountSignedIn");
        const query = new URLSearchParams(window.location.search);
        const requestedNext = query.get("next") || "";
        const nextPath = (() => {
          if (!requestedNext.startsWith("/") || requestedNext.startsWith("//") || requestedNext.includes("\\")) {
            return "";
          }
          try {
            const destination = new URL(requestedNext, window.location.origin);
            if (destination.origin !== window.location.origin) return "";
            return `${destination.pathname}${destination.search}${destination.hash}`;
          } catch {
            return "";
          }
        })();
        const signOutRequested = query.get("signout") === "1";
        let redirected = false;
        const render = () => {
          const isSignedIn = Boolean(clerk.user);
          mount.hidden = isSignedIn;
          signedIn.classList.toggle("visible", isSignedIn);
          if (isSignedIn && nextPath && !redirected) {
            redirected = true;
            window.location.assign(nextPath);
          }
        };
        if (signOutRequested) {
          if (clerk.user) {
            await clerk.signOut({ redirectUrl: "/" });
          } else {
            window.location.assign("/");
          }
          return;
        }
        if (clerk.user) {
          render();
        } else {
          const signUpUrl = nextPath
            ? `/account?mode=sign-up&next=${encodeURIComponent(nextPath)}`
            : "/account?mode=sign-up";
          clerk.mountSignIn(mount, { signUpUrl });
          clerk.addListener(render);
        }
        document.getElementById("signOutBtn").addEventListener("click", () => clerk.signOut({ redirectUrl: "/" }));
      } catch (caught) {
        error.textContent = caught.message || "Could not load account sign-in.";
      }
    })();
  </script>
</body>
</html>
